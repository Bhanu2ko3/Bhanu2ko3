<svg xmlns="http://www.w3.org/2000/svg" width="480" height="165" viewBox="0 0 480 165">
  <!-- Subtle dark terminal card background & border -->
  <rect x="2" y="2" width="476" height="161" rx="8" ry="8" fill="#070c07" stroke="#1b2d1b" stroke-width="1.5"/>
  
  <!-- Linux Terminal Header Bar -->
  <path d="M2 10 C2 5.57 5.57 2 10 2 L470 2 C474.43 2 478 5.57 478 10 L478 34 L2 34 Z" fill="#0d160d"/>
  <line x1="2" y1="34" x2="478" y2="34" stroke="#1b2d1b" stroke-width="1"/>
  
  <!-- Linux Prompt & Title on Left -->
  <text x="14" y="22" fill="#00FF00" font-family="'Fira Code', 'DejaVu Sans Mono', 'Ubuntu Mono', monospace" font-size="11" font-weight="bold">codebro@linux:~$ ./codebroai_studio.sh</text>
  
  <!-- Linux Terminal Window Controls (─ □ ✕) on Right -->
  <g fill="#456645" font-family="sans-serif" font-size="11" font-weight="bold">
    <text x="424" y="21">─</text>
    <text x="440" y="21">□</text>
    <text x="456" y="21">✕</text>
  </g>

  <!-- Status Tag -->
  <rect x="388" y="48" width="72" height="18" rx="4" fill="#032003" stroke="#005500" stroke-width="1"/>
  <text x="424" y="61" fill="#00FF00" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">● LIVE</text>

  <!-- Card Body Content -->
  <text x="20" y="62" fill="#FFFFFF" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15" font-weight="bold">CodebroAI Studio</text>
  <text x="20" y="80" fill="#00DD00" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11" font-weight="500">Official Agency &amp; Digital Studio</text>

  <!-- Tech Tags -->
  <rect x="20.0" y="98" width="66.5" height="20" rx="4" fill="#0a140a" stroke="#1b381b" stroke-width="1"/><text x="53.2" y="112" fill="#00FF00" font-family="monospace" font-size="10" text-anchor="middle">Next.js</text><rect x="92.5" y="98" width="51.5" height="20" rx="4" fill="#0a140a" stroke="#1b381b" stroke-width="1"/><text x="118.2" y="112" fill="#00FF00" font-family="monospace" font-size="10" text-anchor="middle">React</text><rect x="150.0" y="98" width="89.0" height="20" rx="4" fill="#0a140a" stroke="#1b381b" stroke-width="1"/><text x="194.5" y="112" fill="#00FF00" font-family="monospace" font-size="10" text-anchor="middle">Cloudflare</text>

  <!-- Action Button -->
  <rect x="20" y="128" width="125" height="24" rx="4" fill="#00FF00" fill-opacity="0.08" stroke="#00CC00" stroke-opacity="0.6" stroke-width="1"/>
  <text x="82.5" y="144" fill="#00FF00" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">VISIT STUDIO ↗</text>
</svg>